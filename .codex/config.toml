service_tier = "auto"      # anything other than "fast"/"priority"; "auto" lets Codex use Standard
approval_policy = "on-request"

# Do not combine this with sandbox_mode or [sandbox_workspace_write].
default_permissions = "repo"

[agents]
max_threads = 2
max_depth = 1

[features]
fast_mode = false

# Persist the opt-out that `/fast off` writes, so a fast-on default can't re-apply
[notice]
fast_default_opt_out = true

[permissions.repo]
extends = ":workspace"

# Rules are relative to every workspace root.
[permissions.repo.filesystem.":workspace_roots"]

".agents/specs" = "write"

# These remain readable, but any modification needs an approval escalation.
".codex/" = "read"
".agents/" = "read"
"AGENTS.md" = "read"


# Hard block: Codex cannot read or write these through its sandbox.
".venv/" = "deny"
"node_modules/" = "deny"
"dist/" = "deny"